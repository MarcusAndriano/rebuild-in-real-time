name: Weekly data pull

# Tuesdays at 06:00 UTC — after the weekend's matches and any Monday night
# fixture have settled in the source.
on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Pull this week's data
        # Understat only — no browser. src/fetch.py exits non-zero if it wrote
        # nothing, so a silent no-op run shows up as a red build rather than as
        # a gap nobody notices until January.
        run: python -m src.fetch weekly --season 2526

      - name: Commit
        run: |
          git config user.name  "weekly-pull"
          git config user.email "actions@github.com"
          git add data/raw/weekly
          if git diff --staged --quiet; then
            echo "No new data this week."
          else
            git commit -m "data: weekly pull $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open an issue if the pull failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly pull failed — ${new Date().toISOString().slice(0,10)}`,
              body: [
                'The scheduled Understat pull failed.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Backfill before the gap grows — missed matchweeks are not recoverable later.',
              ].join('\n'),
            })
